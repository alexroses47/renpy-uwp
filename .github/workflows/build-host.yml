name: build-host

# Milestone 0: build the UWP host, package it as .msix, sign it and publish it
# (plus the VCLibs dependency and the public .cer) as the artifact "renpy-uwp-x64".
#
#   gh workflow run build-host.yml
#   gh run watch
#   gh run download -n renpy-uwp-x64

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: MSBuild configuration
        type: choice
        options: [Release, Debug]
        default: Release

permissions:
  contents: read

concurrency:
  group: build-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      SDK_VERSION: 10.0.22621.0
    steps:
      - uses: actions/checkout@v4

      - name: Check that no game assets or secrets are tracked
        shell: bash
        run: bash ci/check-no-game-assets.sh

      - uses: microsoft/setup-msbuild@v2

      - name: Restore SDL2 from cache
        id: cache-sdl2
        uses: actions/cache@v4
        with:
          path: out/deps/sdl2
          key: sdl2-uwp-x64-${{ env.CONFIGURATION }}-${{ hashFiles('deps/sdl2/*.ps1') }}

      - name: Build SDL2 (WinRT)
        if: steps.cache-sdl2.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./deps/sdl2/build.ps1 -Prefix "$env:GITHUB_WORKSPACE/out/deps/sdl2" -Configuration $env:CONFIGURATION

      - name: Host Python 3.12 (frozen modules and .pyc generation)
        id: hostpy
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore CPython from cache
        id: cache-cpython
        uses: actions/cache@v4
        with:
          path: out/deps/cpython
          key: cpython-uwp-x64-${{ env.CONFIGURATION }}-${{ hashFiles('python/cpython-uwp/**') }}-py${{ steps.hostpy.outputs.python-version }}

      - name: Build CPython 3.12 (UWP, static)
        if: steps.cache-cpython.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./python/cpython-uwp/build.ps1 -Prefix "$env:GITHUB_WORKSPACE/out/deps/cpython" -HostPython "${{ steps.hostpy.outputs.python-path }}" -Configuration $env:CONFIGURATION

      - name: Restore media dependencies from cache
        id: cache-media
        uses: actions/cache@v4
        with:
          path: out/deps/media
          key: media-uwp-x64-${{ hashFiles('deps/media/**') }}

      - name: MSVC environment for UWP (FFmpeg configure)
        if: steps.cache-media.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          uwp: true

      - name: Install NASM
        if: steps.cache-media.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build media dependencies (png, jpeg, webp, freetype, harfbuzz, fribidi, SDL2_image, FFmpeg LGPL)
        if: steps.cache-media.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./deps/media/build.ps1 -Prefix "$env:GITHUB_WORKSPACE/out/deps/media" -ZlibPrefix "$env:GITHUB_WORKSPACE/out/deps/cpython" -SdlPrefix "$env:GITHUB_WORKSPACE/out/deps/sdl2"

      - name: Restore Ren'Py static modules from cache
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: out/deps/renpy
          key: renpy-uwp-x64-${{ hashFiles('renpy/VERSION', 'renpy/uwp/**', 'python/cpython-uwp/**', 'deps/media/**', 'deps/sdl2/*.ps1') }}-py${{ steps.hostpy.outputs.python-version }}

      - name: Build Ren'Py static modules (Cython 3.2.4) and renpy.zip
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./renpy/uwp/build.ps1 -Prefix "$env:GITHUB_WORKSPACE/out/deps/renpy" -HostPython "${{ steps.hostpy.outputs.python-path }}" -PythonPrefix "$env:GITHUB_WORKSPACE/out/deps/cpython" -SdlPrefix "$env:GITHUB_WORKSPACE/out/deps/sdl2" -MediaPrefix "$env:GITHUB_WORKSPACE/out/deps/media"

      - name: Restore test media from cache
        id: cache-testmedia
        uses: actions/cache@v4
        with:
          path: out/testmedia
          key: testmedia-${{ hashFiles('ci/make-test-media.ps1') }}

      - name: Generate synthetic test media (PNG, OGG, VP9 8/10-bit MKV)
        if: steps.cache-testmedia.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./ci/make-test-media.ps1 -OutDir "$env:GITHUB_WORKSPACE/out/testmedia"

      - name: Stage Python stdlib zip next to the host project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force host/RenpyUWP/python | Out-Null
          Copy-Item out/deps/cpython/python312.zip host/RenpyUWP/python/python312.zip
          Copy-Item out/deps/renpy/renpy.zip host/RenpyUWP/python/renpy.zip
          New-Item -ItemType Directory -Force host/RenpyUWP/python/test | Out-Null
          Copy-Item out/testmedia/* host/RenpyUWP/python/test/
          Get-ChildItem out/deps/media/lib -Filter *.lib | Select-Object Name, Length | Format-Table -AutoSize | Out-String
          Get-Content out/deps/cpython/cpython-uwp-build.json

      - name: Stage SDL2 runtime next to the host project
        shell: pwsh
        run: |
          Copy-Item out/deps/sdl2/bin/SDL2.dll host/RenpyUWP/SDL2.dll
          Get-Content out/deps/sdl2/sdl2-build.json

      - name: Decode signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.UWP_CERT_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.UWP_CERT_PASSWORD }}
        run: |
          if (-not $env:PFX_B64 -or -not $env:PFX_PASS) {
            throw "Secrets UWP_CERT_PFX_BASE64 and/or UWP_CERT_PASSWORD are not set (see docs/SIGNING.md)"
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'renpy-uwp.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64.Trim()))
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:PFX_PASS)
          Write-Host "Certificate: $($cert.Subject)  thumbprint=$($cert.Thumbprint)  notAfter=$($cert.NotAfter)"
          [xml]$m = Get-Content host/RenpyUWP/Package.appxmanifest
          $publisher = $m.Package.Identity.Publisher
          if ($cert.Subject -ne $publisher) {
            throw "Certificate subject '$($cert.Subject)' does not match manifest Publisher '$publisher'"
          }
          $cer = Join-Path $env:RUNNER_TEMP 'RenpyUWP.cer'
          [IO.File]::WriteAllBytes($cer, $cert.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
          "PFX_PATH=$pfx" >> $env:GITHUB_ENV
          "CER_PATH=$cer" >> $env:GITHUB_ENV

      - name: Set package version (0.0.<run_number>.0)
        shell: pwsh
        run: |
          $version = "0.0.$($env:GITHUB_RUN_NUMBER).0"
          $path = (Resolve-Path host/RenpyUWP/Package.appxmanifest).Path
          [xml]$m = Get-Content $path
          $m.Package.Identity.Version = $version
          $m.Save($path)
          Write-Host "Package version: $version"
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build and package (unsigned)
        shell: pwsh
        run: |
          $pkgDir = (Join-Path $env:GITHUB_WORKSPACE 'out/AppPackages').Replace('\', '/') + '/'
          msbuild host/RenpyUWP/RenpyUWP.vcxproj /m /nologo /v:minimal `
            /p:Configuration=$env:CONFIGURATION /p:Platform=x64 `
            /p:AppxPackageDir=$pkgDir `
            /p:SdlDir="$env:GITHUB_WORKSPACE/out/deps/sdl2" `
            /p:PythonDir="$env:GITHUB_WORKSPACE/out/deps/cpython" `
            /p:MediaDir="$env:GITHUB_WORKSPACE/out/deps/media" `
            /p:RenpyDir="$env:GITHUB_WORKSPACE/out/deps/renpy" `
            /p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed with exit code $LASTEXITCODE" }
          Get-ChildItem -Recurse out/AppPackages | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300

      - name: Audit imports of RenpyUWP.exe (dumpbin /imports)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse host/RenpyUWP -Filter RenpyUWP.exe | Where-Object { $_.FullName -notmatch 'AppPackages' } | Select-Object -First 1
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          & $dumpbin.FullName /nologo /imports $exe.FullName | Set-Content -Encoding utf8 dist/imports-RenpyUWP.txt
          # Python runs on the main thread: the linker /STACK reserve must be 8 MB (0x800000).
          $stack = & $dumpbin.FullName /nologo /headers $exe.FullName | Select-String 'size of stack reserve'
          Write-Host "PE header: $stack"
          if ("$stack" -notmatch '^\s*800000 size of stack reserve') { throw "stack reserve is not 8 MB: $stack" }
          $dlls = Select-String -Path dist/imports-RenpyUWP.txt -Pattern '^\s{4}(\S+\.dll)$' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique
          Write-Host "Imported DLLs:"; $dlls | ForEach-Object { Write-Host "  $_" }
          $odd = $dlls | Where-Object { $_ -notmatch '^(api-ms-win-|ext-ms-win-|vcruntime140_app|msvcp140_app|vccorlib140_app|SDL2\.dll)' }
          if ($odd) { Write-Host "::warning::DLLs outside the API sets: $($odd -join ', ') (see dist/imports-RenpyUWP.txt)" }

      - name: Sign package
        shell: pwsh
        env:
          PFX_PASS: ${{ secrets.UWP_CERT_PASSWORD }}
        run: |
          $signtool = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\$env:SDK_VERSION\x64\signtool.exe"
          if (-not (Test-Path $signtool)) { throw "signtool not found at $signtool" }
          $pkg = Get-ChildItem -Recurse out/AppPackages -Include *.msix, *.appx |
                 Where-Object { $_.FullName -notmatch '\\Dependencies\\' } | Select-Object -First 1
          if (-not $pkg) { throw "No .msix/.appx produced" }
          & $signtool sign /fd SHA256 /f $env:PFX_PATH /p $env:PFX_PASS $pkg.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          # Trust the cert on the runner only to verify the signature end to end.
          Import-Certificate -FilePath $env:CER_PATH -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          & $signtool verify /pa /v $pkg.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }
          "PKG_PATH=$($pkg.FullName)" >> $env:GITHUB_ENV

      - name: Stage artifact
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Force dist
          $deps = New-Item -ItemType Directory -Force dist/Dependencies/x64
          Copy-Item $env:PKG_PATH $dist
          Copy-Item $env:CER_PATH $dist
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item out/deps/sdl2/licenses/* dist/licenses/
          Copy-Item out/deps/cpython/licenses/* dist/licenses/
          Copy-Item out/deps/media/licenses/* dist/licenses/
          Copy-Item out/deps/renpy/licenses/* dist/licenses/
          $listing = & tar -tf $env:PKG_PATH
          if (-not ($listing -contains 'SDL2.dll')) { throw "SDL2.dll is not at the package root:`n$($listing -join "`n")" }
          foreach ($f in @('python/python312.zip', 'python/smoke.py', 'python/media_test.py', 'python/renpy.zip', 'python/test/test.png', 'python/test/test.ogg', 'python/test/test-vp9.mkv', 'python/test/test-vp9-10bit.mkv')) {
            if (-not ($listing -contains $f)) { throw "$f is not in the package:`n$($listing -join "`n")" }
          }
          $vclibs = Get-ChildItem -Recurse out/AppPackages -Filter 'Microsoft.VCLibs.x64.*.appx' |
                    Where-Object { $_.FullName -match '\\Dependencies\\x64\\' }
          if (-not $vclibs) {
            $flavor = if ($env:CONFIGURATION -eq 'Debug') { 'Debug' } else { 'Retail' }
            $vclibs = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows Kits\10\ExtensionSDKs\Microsoft.VCLibs\14.0\Appx\$flavor\x64\*.appx"
            if (-not $vclibs) { throw "VCLibs .appx not found" }
          }
          $vclibs | Copy-Item -Destination $deps
          @{
            name = 'RenpyUWP'; version = $env:PACKAGE_VERSION; arch = 'x64'; appId = 'App'
            configuration = $env:CONFIGURATION; commit = $env:GITHUB_SHA; run = $env:GITHUB_RUN_ID
            package = (Split-Path -Leaf $env:PKG_PATH)
          } | ConvertTo-Json | Set-Content -Encoding utf8 dist/package-info.json
          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 300

      - uses: actions/upload-artifact@v4
        with:
          name: renpy-uwp-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
